    <script>
      // Ao abrir este arquivo-fonte direto pelo disco, encaminha para o build
      // autocontido. No servidor de desenvolvimento nada acontece.
      if (location.protocol === 'file:' && document.querySelector('script[src="/src/main.ts"]')) {
        document.getElementById('app').innerHTML =
          '<div style="max-width:620px;margin:12vh auto;padding:28px 30px;border:1px solid #e5dfd2;border-radius:14px;background:#fffdf8;font-family:Inter,Segoe UI,system-ui,sans-serif;color:#1f242b;line-height:1.55">' +
          '<h1 style="margin:0 0 10px;font-size:20px">Abrindo a versão compilada…</h1>' +
          '<p style="margin:0;color:#59616d">Se a página não abrir, rode <code>npm run build</code> e recarregue este arquivo.</p>' +
          '</div>';
        location.replace('dist/index.html');
      }
    </script>
  </body>
